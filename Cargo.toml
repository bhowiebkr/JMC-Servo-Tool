[workspace]
resolver = "3"
members = ["crates/jmc-core", "apps/jmc", "apps/jmc-servo-tool"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MPL-2.0"
repository = "https://github.com/bhowiebkr/JMC-Servo-Tool"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
jmc-core = { path = "crates/jmc-core" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

[profile.dev]
debug = 1
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = false
