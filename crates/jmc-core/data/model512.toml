  { value = 0, label = "0.1 µs" },
  { value = 1, label = "0.4 µs" },
  { value = 2, label = "0.8 µs" },
  { value = 3, label = "1.6 µs" },
]

[[param]]
code = "P03-05"
name = "In-position condition"
min = 0
max = 2
default = 1
applies = "now"
brief = "Selects when the drive sets the in-position output. The range is P03-06."
choices = [
  { value = 0, label = "Position error below P03-06" },
  { value = 1, label = "Command complete and error below P03-06" },
  { value = 2, label = "Filtered command complete and error below P03-06" },
]

[[param]]
code = "P03-06"
name = "In-position range"
unit = "encoder counts"
min = 0
max = 65535
default = 100
applies = "now"
brief = "The position error below which the drive sets the in-position output. An absolute encoder gives 131072 counts per turn. An incremental encoder gives 4 counts per line."

[[param]]
code = "P03-07"
name = "Position feedback format"
min = 0
max = 1
default = 0
applies = "now"
change = "servo-off"
brief = "Selects the format of the position feedback."
choices = [
  { value = 0, label = "Incremental" },
  { value = 1, label = "Absolute, multi-turn" },
]

[[param]]
code = "P03-09"
name = "Command pulses per turn"
unit = "pulses"
min = 0
max = 65535
default = 10000
applies = "power-cycle"
brief = "The number of command pulses for one motor turn. 0 means that the drive uses the electronic gear P03-10 and P03-11."

[[param]]
code = "P03-10"
name = "Electronic gear 1 numerator"
min = 1
max = 65535
default = 1
applies = "power-cycle"
brief = "The numerator of electronic gear 1. The drive multiplies each command pulse by the numerator divided by the denominator P03-11. It applies when P03-09 is 0."

[[param]]
code = "P03-11"
name = "Electronic gear 1 denominator"
min = 1
max = 65535
default = 1
applies = "power-cycle"
brief = "The denominator of electronic gear 1. See P03-10."

[[param]]
code = "P03-12"
name = "Electronic gear 1 numerator, high part"
min = 0
max = 32767
default = 0
applies = "power-cycle"
change = "servo-off"
brief = "Extends the numerator of electronic gear 1. Numerator = P03-12 × 10000 + P03-10."

[[param]]
code = "P03-13"
name = "Electronic gear 2 numerator"
min = 1
max = 65535
default = 1
applies = "power-cycle"
brief = "The numerator of electronic gear 2. A digital input with function 6 selects gear 2."

[[param]]
code = "P03-14"
name = "Electronic gear 2 denominator"
min = 1
max = 65535
default = 1
applies = "power-cycle"
brief = "The denominator of electronic gear 2. See P03-13."

[[param]]
code = "P03-15"
name = "Position error alarm level"
unit = "× 10 pulses"
min = 0
max = 65535
default = 30000
applies = "now"
brief = "The largest allowed position error, in units of 10 command pulses. If the error is larger, the drive stops with an alarm."

[[param]]
code = "P03-16"
name = "Position command filter"
unit = "ms"
decimals = 1
min = 0
max = 10000
default = 0
applies = "now"
brief = "A smoothing filter on the position command. A higher value gives smoother motion, but more delay."

[[param]]
code = "P03-20"
name = "Position feedback source"
min = 0
max = 1
default = 0
applies = "now"
brief = "Selects the feedback for the position loop."
choices = [
  { value = 0, label = "Motor encoder" },
  { value = 1, label = "Linear scale" },
]

[[param]]
code = "P03-22"
name = "Encoder output divider numerator"
min = 1
max = 65535
default = 1
applies = "now"
brief = "Sets the encoder output rate on CN1 for an incremental encoder. Output lines per turn = encoder lines × P03-23 / P03-22. P03-23 must not be larger than P03-22."

[[param]]
code = "P03-23"
name = "Encoder output divider denominator"
min = 1
max = 65535
default = 1
applies = "now"
brief = "The denominator of the encoder output divider. See P03-22."

[[param]]
code = "P03-25"
name = "Encoder output pulses per turn"
unit = "pulses"
min = 0
max = 60000
default = 2500
applies = "now"
brief = "The number of pulses on each of the A and B outputs for one motor turn. It applies to an absolute encoder."

[[param]]
code = "P03-30"
name = "Linear scale A/B phase"
min = 0
max = 1
default = 0
applies = "now"
change = "servo-off"
brief = "Reverses the A/B phase order of the linear scale input."
choices = [
  { value = 0, label = "Normal" },
  { value = 1, label = "Reversed" },
]

[[param]]
code = "P03-31"
name = "Linear scale Z polarity"
min = 0
max = 1
default = 1
applies = "now"
change = "servo-off"
brief = "The active level of the Z signal from the linear scale."
choices = [
  { value = 0, label = "Active low" },
  { value = 1, label = "Active high" },
]

[[param]]
code = "P03-40"
name = "Encoder output source"
min = 0
max = 3
default = 1
applies = "now"
change = "servo-off"
brief = "Selects the signal on the encoder output of CN1."
choices = [
  { value = 0, label = "Pulse command (stops at alarm)" },
  { value = 1, label = "Motor encoder" },
  { value = 2, label = "Pulse command" },
  { value = 3, label = "Linear scale" },
]

[[param]]
code = "P03-41"
name = "Encoder output A/B invert"
min = 0
max = 1
default = 0
applies = "now"
change = "servo-off"
brief = "Reverses the A/B phase order of the encoder output."
choices = [
  { value = 0, label = "Normal" },
  { value = 1, label = "Reversed" },
]

[[param]]
code = "P03-42"
name = "Encoder output Z polarity"
min = 0
max = 1
default = 1
applies = "now"
change = "servo-off"
brief = "The active level of the Z signal on the encoder output."
choices = [
  { value = 0, label = "Active low" },
  { value = 1, label = "Active high" },
]

[[param]]
code = "P03-43"
name = "Pulse input edge"
min = 0
max = 1
default = 0
applies = "now"
brief = "Selects the edge of the pulse command that the drive counts."
choices = [
  { value = 0, label = "Rising edge" },
  { value = 1, label = "Falling edge" },
]

[[param]]
code = "P03-45"
name = "Digital position buffer"
min = 0
max = 1
default = 0
applies = "now"
change = "servo-off"
