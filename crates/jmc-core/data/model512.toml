choices = [
  { value = 0, label = "No buffer: the new command starts now" },
  { value = 1, label = "Buffer: the current command finishes first" },
]

[[param]]
code = "P03-46"
name = "Digital position maximum speed"
unit = "rpm"
min = 0
max = 6000
default = 1000
applies = "now"
brief = "The maximum motor speed for digital position commands."

[[param]]
code = "P03-50"
name = "Gantry synchronization"
min = 0
max = 1
default = 0
applies = "now"
change = "servo-off"
brief = "Turns on the synchronization of two motors on one gantry axis."
choices = [
  { value = 0, label = "Off" },
  { value = 1, label = "On" },
]

[[param]]
code = "P03-51"
name = "Gantry input invert"
min = 0
max = 1
default = 0
applies = "now"
change = "servo-off"
brief = "Inverts the input signal of the gantry synchronization."
choices = [
  { value = 0, label = "Normal" },
  { value = 1, label = "Inverted" },
]

[[param]]
code = "P03-52"
name = "Gantry feedback pulses per turn"
unit = "pulses"
min = 0
max = 65535
default = 10000
applies = "now"
change = "servo-off"
brief = "The number of feedback pulses for one turn of the other gantry motor."

[[param]]
code = "P03-53"
name = "Gantry error alarm level"
min = 0
max = 65535
default = 10000
applies = "now"
brief = "The largest allowed position difference between the two gantry motors. If the difference is larger, the drive stops with an alarm."

[[param]]
code = "P03-55"
name = "Gantry correction gain"
min = 0
max = 200
default = 10
applies = "now"
