# Parameter table for JMC JAND/JASD servo drives, model 512.
#
# The facts (codes, ranges, decimals, defaults, access and when a change applies)
# describe the drive's register interface. The names, units, descriptions and
# choice labels are this project's own text, in Simplified Technical English.
#
# Values are raw register integers: display value x 10^decimals.
# min/max left out = the full 16-bit range. default left out = none known.
# applies: now | power-cycle | read-only | unspecified
# change:  any | servo-off (the tool refuses the write while the drive reports the servo on)
# access:  user | motor | factory (motor and factory are protected)
# Address = group x 100 + index.

[drive]
model = 512
name = "JMC JAND/JASD AC servo drive"

# element: the XML tag of the group in the drive's 19-column parameter file.
# Files that JMC's PC tool loads need these tags.

[[group]]
number = 0
title = "Motor and drive"
element = "P00_Parameter_of_motor_and_dri"

[[group]]
number = 1
title = "Main control"
element = "P01_main_control_parameter"

[[group]]
number = 2
title = "Gains"
element = "P02_Gain_parameter"

[[group]]
number = 3
title = "Position control"
element = "P03_Position_parameters"

[[group]]
number = 4
title = "Speed control"
element = "P04_Speed_parameters"

[[group]]
number = 5
title = "Torque control"
element = "P05_Torque_parameters"

[[group]]
number = 6
title = "Inputs and outputs"
element = "P06_IO_parameters"

[[group]]
number = 8
title = "Advanced functions"
element = "P08_advanced_function_parameter"

[[group]]
number = 10
title = "Factory"
element = "P10_Factory_parameter"

# Text for the registers that have no function.
[text]
spare_name = "Spare"
spare_brief = "Not used. The drive keeps this register for later use."
reserved_name = "Reserved"
reserved_brief = "Reserved. This register has no function."

[[param]]
code = "P00-00"
name = "Motor code"
min = 0
max = 65535
default = 2000
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "Identifies the motor. 2000 means a motor with an absolute encoder: the drive reads P00-01 to P00-05 from the encoder. 0 means that you enter the motor data in P00-01 to P00-17. The factory sets this value for the matched motor."

[[param]]
code = "P00-01"
name = "Motor rated speed"
unit = "rpm"
min = 1
max = 6000
default = 0
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "The rated speed of the motor. The factory sets this value for the matched motor."

[[param]]
code = "P00-02"
name = "Motor rated torque"
unit = "N·m"
decimals = 2
min = 1
max = 65535
default = 0
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "The rated torque of the motor. Torque values in percent refer to this value. The factory sets this value for the matched motor."

[[param]]
code = "P00-03"
name = "Motor rated current"
unit = "A"
decimals = 2
min = 1
max = 65535
default = 0
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "The rated current of the motor. The factory sets this value for the matched motor."

[[param]]
code = "P00-04"
name = "Motor rotor inertia"
unit = "kg·cm²"
decimals = 2
min = 1
max = 65535
default = 0
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "The moment of inertia of the motor rotor. The load inertia ratio P01-04 refers to this value. The factory sets this value for the matched motor."

[[param]]
code = "P00-05"
name = "Motor pole pairs"
unit = "pole pairs"
min = 1
max = 31
default = 0
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "The number of magnetic pole pairs in the motor. The factory sets this value for the matched motor."

[[param]]
code = "P00-07"
name = "Encoder type"
min = 0
max = 3
default = 0
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "The type of encoder on the motor. The factory sets this value for the matched motor."
choices = [
  { value = 0, label = "Incremental" },
  { value = 1, label = "Incremental (same as 0)" },
  { value = 2, label = "Absolute, single-turn" },
  { value = 3, label = "Absolute, multi-turn" },
]

[[param]]
code = "P00-08"
name = "Wire-saving incremental encoder"
min = 0
max = 1
default = 0
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "Tells the drive if the incremental encoder is a wire-saving type, which has fewer signal wires. It applies only when P00-07 is 0 or 1."
choices = [
  { value = 0, label = "Standard encoder" },
  { value = 1, label = "Wire-saving encoder" },
]

[[param]]
code = "P00-09"
name = "Absolute encoder protocol"
min = 0
max = 1
default = 0
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "The serial protocol of the absolute encoder. It applies only when P00-07 is 2 or 3."
choices = [
  { value = 0, label = "Tamagawa" },
  { value = 1, label = "Nikon" },
]

[[param]]
code = "P00-10"
name = "Incremental encoder lines"
unit = "lines"
min = 0
max = 65535
default = 0
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "The number of encoder lines in one motor turn. The drive counts 4 edges for each line. The factory sets this value for the matched motor."

[[param]]
code = "P00-11"
name = "Z pulse electrical angle"
min = 0
max = 65535
default = 0
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "The electrical angle of the rotor at the Z pulse of an incremental encoder. The drive uses it for commutation. The factory sets this value for the matched motor."

[[param]]
code = "P00-12"
name = "Rotor start angle 1"
unit = "°"
min = 0
max = 360
default = 0
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "Start angle 1 of 6 for commutation with an incremental encoder. The drive uses the six angles at start-up. The factory sets this value for the matched motor."

[[param]]
code = "P00-13"
name = "Rotor start angle 2"
unit = "°"
min = 0
max = 360
default = 0
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "Start angle 2 of 6 for commutation with an incremental encoder. The drive uses the six angles at start-up. The factory sets this value for the matched motor."

[[param]]
code = "P00-14"
name = "Rotor start angle 3"
unit = "°"
min = 0
max = 360
default = 0
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "Start angle 3 of 6 for commutation with an incremental encoder. The drive uses the six angles at start-up. The factory sets this value for the matched motor."

[[param]]
code = "P00-15"
name = "Rotor start angle 4"
unit = "°"
min = 0
max = 360
default = 0
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "Start angle 4 of 6 for commutation with an incremental encoder. The drive uses the six angles at start-up. The factory sets this value for the matched motor."

[[param]]
code = "P00-16"
name = "Rotor start angle 5"
unit = "°"
min = 0
max = 360
default = 0
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "Start angle 5 of 6 for commutation with an incremental encoder. The drive uses the six angles at start-up. The factory sets this value for the matched motor."

[[param]]
code = "P00-17"
name = "Rotor start angle 6"
unit = "°"
min = 0
max = 360
default = 0
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "Start angle 6 of 6 for commutation with an incremental encoder. The drive uses the six angles at start-up. The factory sets this value for the matched motor."

[[param]]
code = "P00-20"
name = "Display at power-on"
min = 0
max = 100
default = 100
applies = "power-cycle"
brief = "Selects what the front panel shows at power-on. 100 shows the run state. Other values show the monitor item with that number."

[[param]]
code = "P00-21"
name = "RS232 baud rate"
min = 0
max = 3
default = 0
applies = "power-cycle"
change = "servo-off"
brief = "The baud rate of the RS232 port that connects to a PC. A wrong value stops the PC link. Set the same rate in the PC software. JMC's PC tool gives 9600 bit/s as the factory value, but the manual gives 57600 bit/s."
choices = [
  { value = 0, label = "9600 bit/s" },
  { value = 1, label = "19200 bit/s" },
  { value = 2, label = "57600 bit/s" },
  { value = 3, label = "115200 bit/s" },
]

[[param]]
code = "P00-22"
name = "CAN node ID"
min = 0
max = 31
default = 0
applies = "power-cycle"
change = "servo-off"
brief = "The node ID of this drive on a CAN bus. Each drive on the bus must have a different ID."

[[param]]
code = "P00-23"
name = "Modbus station address"
min = 0
max = 255
default = 1
applies = "power-cycle"
change = "servo-off"
brief = "The Modbus address of this drive. Each drive on the same bus must have a different address. A wrong value stops the Modbus link."

[[param]]
code = "P00-24"
name = "Modbus baud rate"
min = 0
max = 7
default = 2
applies = "power-cycle"
change = "servo-off"
brief = "The baud rate of the Modbus port. All devices on the bus must use the same rate. The value 7 is listed as 25600 bit/s, which is not a standard rate."
choices = [
  { value = 0, label = "2400 bit/s" },
  { value = 1, label = "4800 bit/s" },
  { value = 2, label = "9600 bit/s" },
  { value = 3, label = "19200 bit/s" },
  { value = 4, label = "38400 bit/s" },
  { value = 5, label = "57600 bit/s" },
  { value = 6, label = "115200 bit/s" },
  { value = 7, label = "25600 bit/s (unverified)" },
]

[[param]]
code = "P00-25"
name = "Modbus parity and stop bits"
min = 0
max = 3
default = 1
applies = "power-cycle"
change = "servo-off"
brief = "The parity and the number of stop bits on the Modbus port. All devices on the bus must use the same format."
choices = [
  { value = 0, label = "No parity, 2 stop bits" },
  { value = 1, label = "Even parity, 1 stop bit" },
  { value = 2, label = "Odd parity, 1 stop bit" },
  { value = 3, label = "No parity, 1 stop bit" },
]

[[param]]
code = "P00-26"
name = "Modbus reply delay"
unit = "ms"
min = 0
max = 100
default = 0
applies = "power-cycle"
change = "servo-off"
brief = "The time that the drive waits before it sends a Modbus reply. Increase it if the master cannot change from send to receive fast enough."

[[param]]
code = "P00-27"
name = "CAN baud rate"
min = 0
max = 65535
default = 0
applies = "power-cycle"
change = "servo-off"
brief = "The bit rate of the CAN bus. All devices on the bus must use the same rate. The value 1 is listed as 120 kbit/s, which is not a standard rate. Only the values 0 to 7 select a rate."
choices = [
  { value = 0, label = "12.5 kbit/s" },
  { value = 1, label = "120 kbit/s (unverified)" },
  { value = 2, label = "20 kbit/s" },
  { value = 3, label = "100 kbit/s" },
  { value = 4, label = "125 kbit/s" },
  { value = 5, label = "250 kbit/s" },
  { value = 6, label = "500 kbit/s" },
  { value = 7, label = "1 Mbit/s" },
]

[[param]]
code = "P00-28"
name = "Modbus register map"
min = 0
max = 2
default = 0
applies = "power-cycle"
brief = "Selects the Modbus register map. Use 1 for the standard map."
choices = [
  { value = 0, label = "Not used" },
  { value = 1, label = "Standard" },
  { value = 2, label = "Chishu compatible (adds registers 0x118 and 0x16E)" },
]

[[param]]
code = "P00-29"
name = "Absolute position registers"
min = 0
max = 1
default = 1
applies = "power-cycle"
change = "servo-off"
brief = "Selects which Modbus register holds the turn count and which holds the position in one turn. It applies to absolute encoders."
choices = [
  { value = 0, label = "0x84D = turns, 0x84E = position in turn" },
  { value = 1, label = "0x84E = turns, 0x84D = position in turn" },
]

[[param]]
code = "P00-30"
name = "Braking resistor"
min = 0
max = 2
default = 0
applies = "power-cycle"
change = "servo-off"
brief = "Selects the resistor that absorbs the energy that the motor returns when it slows down. For an external resistor, also set P00-31 and P00-32."
choices = [
  { value = 0, label = "Internal resistor" },
  { value = 1, label = "External resistor" },
  { value = 2, label = "No resistor" },
]

[[param]]
code = "P00-31"
name = "External resistor power"
unit = "× 10 W"
min = 0
max = 65535
default = 0
applies = "power-cycle"
brief = "The power rating of the external braking resistor. For example, 4 means 40 W."

[[param]]
code = "P00-32"
name = "External resistor value"
unit = "Ω"
min = 0
max = 1000
default = 0
applies = "power-cycle"
change = "servo-off"
brief = "The resistance of the external braking resistor."

[[param]]
code = "P00-33"
name = "Braking circuit check"
min = 0
max = 1
default = 0
applies = "power-cycle"
change = "servo-off"
brief = "Turns on the open-circuit and short-circuit check of the braking circuit."
choices = [
  { value = 0, label = "Off" },
  { value = 1, label = "On" },
]

[[param]]
code = "P00-40"
name = "Over-temperature protection"
min = 0
max = 3
default = 1
applies = "power-cycle"
change = "servo-off"
brief = "Selects the temperature sensor for the over-temperature protection. The internal sensor is in the power module."
choices = [
  { value = 0, label = "Off" },
  { value = 1, label = "Internal sensor" },
  { value = 2, label = "External sensor" },
  { value = 3, label = "Find the sensor automatically" },
]

[[param]]
code = "P00-41"
name = "Control power loss protection"
min = 0
max = 1
default = 1
applies = "power-cycle"
change = "servo-off"
access = "motor"
brief = "Turns on the protection that operates when the control power supply fails."
choices = [
  { value = 0, label = "Off" },
  { value = 1, label = "On" },
]

[[param]]
code = "P00-50"
name = "Dead-time compensation"
min = 0
max = 1
default = 1
applies = "unspecified"
change = "servo-off"
access = "factory"
brief = "Turns on compensation for the dead time of the power stage. Factory setting. Do not change it."

[[param]]
code = "P00-51"
name = "Main power loss detection"
min = 0
max = 1
default = 1
applies = "unspecified"
access = "factory"
brief = "Turns on the detection of main power loss. Factory setting. Do not change it."

[[param]]
code = "P00-52"
name = "Undervoltage alarm"
min = 0
max = 1
default = 1
applies = "unspecified"
access = "factory"
brief = "Turns on the alarm for low DC bus voltage. Factory setting. Do not change it."

[[param]]
code = "P00-53"
name = "Phase loss protection"
min = 0
max = 1
default = 0
applies = "unspecified"
access = "factory"
brief = "Turns on the alarm for a missing phase of the main power. Factory setting. Do not change it."

[[param]]
code = "P00-54"
name = "DC bus voltage compensation"
min = 0
max = 1
default = 0
applies = "unspecified"
access = "factory"
brief = "Turns on compensation for changes in the DC bus voltage. Factory setting. Do not change it."

[[param]]
code = "P00-55"
name = "DC bus compensation factor"
min = 0
max = 32767
default = 17300
applies = "unspecified"
access = "factory"
brief = "The factor for the DC bus voltage compensation (P00-54). Factory setting. Do not change it."

[[param]]
code = "P00-59"
name = "Load mode"
min = 0
max = 1
default = 1
applies = "unspecified"
change = "servo-off"
access = "factory"
brief = "The function is not documented. Factory setting. Do not change it."

[[param]]
code = "P00-60"
name = "PWM period"
min = 1
max = 8092
default = 4999
applies = "unspecified"
change = "servo-off"
access = "factory"
brief = "The switching period of the power stage. The unit is not documented. Factory setting. Do not change it."

[[param]]
code = "P00-61"
name = "PWM load mode"
min = 0
max = 1
default = 1
applies = "unspecified"
change = "servo-off"
access = "factory"
brief = "The function is not documented. Factory setting. Do not change it."

[[param]]
code = "P00-62"
name = "Speed loop sample rate"
min = 1
max = 8
default = 2
applies = "unspecified"
change = "servo-off"
access = "factory"
brief = "The sample rate of the speed loop. The scale is not documented. Factory setting. Do not change it."

[[param]]
code = "P00-63"
name = "Position loop sample rate"
min = 1
max = 8
default = 4
applies = "unspecified"
change = "servo-off"
access = "factory"
brief = "The sample rate of the position loop. The scale is not documented. Factory setting. Do not change it."

[[param]]
code = "P01-01"
name = "Control mode"
min = 0
max = 6
default = 0
applies = "now"
change = "servo-off"
brief = "Selects what the drive controls. Modes 3, 4 and 5 use a digital input with function 5 to change between the two modes."
choices = [
  { value = 0, label = "Position" },
  { value = 1, label = "Speed" },
  { value = 2, label = "Torque" },
  { value = 3, label = "Speed or torque (input selects)" },
  { value = 4, label = "Position or speed (input selects)" },
  { value = 5, label = "Position or torque (input selects)" },
  { value = 6, label = "Full closed loop" },
]

[[param]]
code = "P01-02"
name = "Auto-tuning mode"
min = 0
max = 3
default = 1
applies = "now"
brief = "Selects how the drive sets the loop gains. In modes 1 to 3, the drive sets the gains from the stiffness level P01-03 and you cannot change them. Mode 2 also fixes P02-03 at 30 % and P02-04 at 0.50 ms."
choices = [
  { value = 0, label = "Manual gains" },
  { value = 1, label = "Automatic, standard" },
  { value = 2, label = "Automatic, positioning" },
  { value = 3, label = "Automatic, mode 2" },
]

[[param]]
code = "P01-03"
name = "Stiffness level"
min = 0
max = 31
default = 13
applies = "now"
brief = "Selects one of 32 built-in gain sets when P01-02 is 1, 2 or 3. A higher level gives a stiffer and faster response. Too high a level causes noise and vibration."

[[param]]
code = "P01-04"
name = "Load inertia ratio"
unit = "×"
decimals = 2
min = 0
max = 10000
default = 300
applies = "now"
brief = "The load inertia divided by the motor rotor inertia (P00-04). The drive uses it to calculate the speed loop gain. Set it from an inertia identification or from the machine data."

[[param]]
code = "P01-10"
name = "Stop mode at overtravel"
min = 0
max = 1
default = 1
applies = "now"
brief = "Selects how the motor stops when a limit input operates. After the stop, the drive accepts only commands in the reverse direction."
choices = [
  { value = 0, label = "Coast (motor free)" },
  { value = 1, label = "Hold position (servo locked)" },
]

[[param]]
code = "P01-20"
name = "Dynamic brake delay"
unit = "ms"
min = 0
max = 250
default = 50
applies = "now"
brief = "The delay from the brake condition to the start of the dynamic brake."

[[param]]
code = "P01-21"
name = "Dynamic brake at main power loss"
min = 0
max = 1
default = 1
applies = "now"
brief = "Selects if the drive uses the dynamic brake when the main power goes off. The dynamic brake shorts the motor windings to stop the motor."
choices = [
  { value = 0, label = "Use dynamic brake" },
  { value = 1, label = "Do not use dynamic brake" },
]

[[param]]
code = "P01-22"
name = "Dynamic brake at servo off"
min = 0
max = 1
default = 1
applies = "now"
brief = "Selects if the drive uses the dynamic brake when the servo goes off."
choices = [
  { value = 0, label = "Use dynamic brake" },
  { value = 1, label = "Do not use dynamic brake" },
]

[[param]]
code = "P01-23"
name = "Dynamic brake at alarm"
min = 0
max = 1
default = 1
applies = "now"
brief = "Selects if the drive uses the dynamic brake when an alarm stops the motor."
choices = [
  { value = 0, label = "Use dynamic brake" },
  { value = 1, label = "Do not use dynamic brake" },
]

[[param]]
code = "P01-24"
name = "Dynamic brake at overtravel"
min = 0
max = 1
default = 1
applies = "now"
brief = "Selects if the drive uses the dynamic brake when a limit input stops the motor."
choices = [
  { value = 0, label = "Use dynamic brake" },
  { value = 1, label = "Do not use dynamic brake" },
]

[[param]]
code = "P01-30"
name = "Brake delay, motor stopped"
unit = "ms"
min = 0
max = 255
default = 50
applies = "now"
brief = "At servo on, the drive accepts commands this time after it releases the holding brake. At servo off with the motor stopped, the motor stays energized for this time after the brake engages."

[[param]]
code = "P01-31"
name = "Brake speed threshold"
unit = "rpm"
min = 0
max = 3000
default = 100
applies = "now"
brief = "At servo off with the motor turning, the drive engages the holding brake when the speed falls below this value. The time limit is P01-32."

[[param]]
code = "P01-32"
name = "Brake wait time, motor turning"
unit = "ms"
min = 0
max = 255
default = 50
applies = "now"
brief = "At servo off with the motor turning, the longest time that the drive waits before it engages the holding brake. See also P01-31."

[[param]]
code = "P01-35"
name = "Z pulse output width"
unit = "ms"
decimals = 1
min = 0
max = 65535
default = 0
applies = "now"
brief = "The width of the Z pulse on the encoder output. 0 gives the default width."

[[param]]
code = "P01-40"
name = "Runaway detection"
min = 0
max = 1
default = 1
applies = "now"
brief = "Stops the motor with an alarm if it turns out of control or in the wrong direction."
choices = [
  { value = 0, label = "Off" },
  { value = 1, label = "On" },
]

[[param]]
code = "P01-50"
name = "Servo-on source"
min = 0
max = 1
default = 1
applies = "unspecified"
change = "servo-off"
access = "factory"
brief = "Factory setting. Do not change it."

[[param]]
code = "P01-57"
name = "Overload threshold"
min = 0
max = 65535
default = 703
applies = "unspecified"
change = "servo-off"
access = "factory"
brief = "The threshold for the motor overload protection. Factory setting. Do not change it."

[[param]]
code = "P01-58"
name = "D-axis back-EMF constant"
min = 0
max = 65535
default = 0
applies = "unspecified"
change = "servo-off"
access = "factory"
brief = "Factory setting. Do not change it."

[[param]]
code = "P01-59"
name = "Q-axis back-EMF constant"
min = 0
max = 65535
default = 0
applies = "unspecified"
change = "servo-off"
access = "factory"
brief = "Factory setting. Do not change it."

[[param]]
code = "P01-60"
name = "Encoder Z pulse enable"
min = 0
max = 1
default = 1
applies = "unspecified"
change = "servo-off"
access = "factory"
brief = "Factory setting. Do not change it."

[[param]]
code = "P01-61"
name = "Speed pulse source"
min = 0
max = 1
default = 0
applies = "unspecified"
change = "servo-off"
access = "factory"
brief = "Factory setting. Do not change it."

[[param]]
code = "P01-62"
name = "Speed pulse edge"
min = 0
max = 3
default = 0
applies = "unspecified"
change = "servo-off"
access = "factory"
brief = "Factory setting. Do not change it."

[[param]]
code = "P01-63"
name = "Encoder direction invert"
min = 0
max = 1
default = 1
applies = "unspecified"
change = "servo-off"
access = "factory"
brief = "Factory setting. Do not change it."

[[param]]
code = "P01-64"
name = "Encoder Z pulse polarity"
min = 0
max = 1
default = 1
applies = "unspecified"
change = "servo-off"
access = "factory"
brief = "Factory setting. Do not change it."

[[param]]
code = "P01-70"
name = "Speed filter"
min = 0
max = 3
default = 1
applies = "unspecified"
change = "servo-off"
access = "factory"
brief = "Factory setting. Do not change it."

[[param]]
code = "P02-00"
name = "Position loop gain 1"
unit = "1/s"
decimals = 1
min = 0
max = 30000
default = 480
applies = "now"
brief = "The proportional gain of the position loop in gain set 1. A higher value gives more stiffness and less following error. Too high a value causes overshoot and vibration."

[[param]]
code = "P02-01"
name = "Position loop gain 2"
unit = "1/s"
decimals = 1
min = 0
max = 30000
default = 570
applies = "now"
brief = "The proportional gain of the position loop in gain set 2. A higher value gives more stiffness and less following error. Too high a value causes overshoot and vibration."

[[param]]
code = "P02-03"
name = "Speed feedforward gain"
unit = "%"
decimals = 1
min = 0
max = 1000
default = 300
applies = "now"
brief = "The part of the position command rate that goes directly to the speed loop. A higher value reduces the following error. Too high a value causes overshoot."

[[param]]
code = "P02-04"
name = "Speed feedforward filter"
unit = "ms"
decimals = 2
min = 0
max = 6400
default = 50
applies = "now"
brief = "A low-pass filter on the speed feedforward (P02-03). A higher value gives a smoother signal, but more delay."

[[param]]
code = "P02-10"
name = "Speed loop gain 1"
unit = "Hz"
decimals = 1
min = 10
max = 20000
default = 270
applies = "now"
brief = "The proportional gain of the speed loop in gain set 1. A higher value gives a stiffer and faster response. Too high a value causes vibration and noise."

[[param]]
code = "P02-11"
name = "Speed loop integral time 1"
unit = "ms"
decimals = 1
min = 1
max = 10000
default = 100
applies = "now"
brief = "The integral time constant of the speed loop in gain set 1. A lower value removes speed error faster. Too low a value causes vibration and noise."

[[param]]
code = "P02-12"
name = "Speed loop PDFF factor 1"
unit = "%"
decimals = 1
min = 0
max = 1000
default = 1000
applies = "now"
brief = "The mix of PI control and pseudo-derivative feedback in the speed loop, gain set 1. 100 % is PI control with the fastest response. Lower values resist low-frequency disturbance better, but respond more slowly."

[[param]]
code = "P02-13"
name = "Speed loop gain 2"
unit = "Hz"
decimals = 1
min = 10
max = 20000
default = 270
applies = "now"
brief = "The proportional gain of the speed loop in gain set 2. A higher value gives a stiffer and faster response. Too high a value causes vibration and noise."

[[param]]
code = "P02-14"
name = "Speed loop integral time 2"
unit = "ms"
decimals = 1
min = 1
max = 10000
default = 10000
applies = "now"
brief = "The integral time constant of the speed loop in gain set 2. A lower value removes speed error faster. Too low a value causes vibration and noise."

[[param]]
code = "P02-15"
name = "Speed loop PDFF factor 2"
unit = "%"
decimals = 1
min = 0
max = 1000
default = 1000
applies = "now"
brief = "The mix of PI control and pseudo-derivative feedback in the speed loop, gain set 2. 100 % is PI control with the fastest response. Lower values resist low-frequency disturbance better, but respond more slowly."

[[param]]
code = "P02-16"
name = "Speed integral limit"
min = 0
max = 32767
default = 25000
applies = "now"
change = "servo-off"
brief = "The limit of the speed loop integrator. It stops the integrator from winding up when the output is at its limit."

[[param]]
code = "P02-19"
name = "Torque feedforward gain"
min = 0
max = 30000
default = 0
applies = "now"
brief = "The gain of the torque feedforward, which the drive calculates from the rate of change of the speed command. 0 turns it off. The scale is not documented, so start with small values."

[[param]]
code = "P02-20"
name = "Torque feedforward filter"
unit = "ms"
decimals = 2
min = 0
max = 6400
default = 80
applies = "now"
brief = "A low-pass filter on the torque feedforward (P02-19). A higher value gives a smoother signal, but more delay."

[[param]]
code = "P02-30"
name = "Gain switching mode"
min = 0
max = 10
default = 7
applies = "now"
brief = "Selects when the drive changes from gain set 1 to gain set 2. The level is P02-31 and the hysteresis is P02-32. The return delay is P02-33."
choices = [
  { value = 0, label = "Gain set 1 only" },
  { value = 1, label = "Gain set 2 only" },
  { value = 2, label = "Digital input (function 9)" },
  { value = 3, label = "Torque command above level" },
  { value = 4, label = "Speed command change above level" },
  { value = 5, label = "Speed command above level" },
  { value = 6, label = "Position error above level" },
  { value = 7, label = "Position command present" },
  { value = 8, label = "Positioning not complete" },
  { value = 9, label = "Actual speed above level" },
  { value = 10, label = "Position command or actual speed above level" },
]

[[param]]
code = "P02-31"
name = "Gain switching level"
min = 0
max = 20000
default = 800
applies = "now"
brief = "The level for the gain switching condition in P02-30. Scale: torque 1000 = 25 % of rated torque; speed 1000 = 200 rpm; position 131072 = one motor turn."

[[param]]
code = "P02-32"
name = "Gain switching hysteresis"
min = 0
max = 20000
default = 100
applies = "now"
brief = "The hysteresis for the gain switching level P02-31. Scale: torque 1000 = 25 % of rated torque; speed 1000 = 200 rpm; position 131072 = one motor turn."

[[param]]
code = "P02-33"
name = "Gain switching delay"
unit = "ms"
decimals = 1
min = 0
max = 10000
default = 100
applies = "now"
brief = "The time from the end of the switching condition to the return to gain set 1."

[[param]]
code = "P02-34"
name = "Position gain switching time"
unit = "ms"
decimals = 1
min = 0
max = 10000
default = 100
applies = "now"
brief = "The time for a smooth change from position loop gain 1 (P02-00) to position loop gain 2 (P02-01)."

[[param]]
code = "P02-40"
name = "P/PI switching condition"
min = 0
max = 4
default = 0
applies = "now"
brief = "Selects the signal that changes the speed loop from PI control to P control. Below the level P02-41 the loop uses PI control. Above it, the loop uses P control."
choices = [
  { value = 0, label = "Torque command" },
  { value = 1, label = "Speed command" },
  { value = 2, label = "Acceleration" },
  { value = 3, label = "Position error" },
  { value = 4, label = "Off (PI control only)" },
]

[[param]]
code = "P02-41"
name = "P/PI switching level"
min = 0
max = 20000
default = 10000
applies = "now"
brief = "The level for the P/PI switching condition in P02-40. Scale: torque 1000 = 25 % of rated torque; speed 1000 = 200 rpm; position 131072 = one motor turn."

[[param]]
code = "P02-50"
name = "Torque offset"
unit = "%"
decimals = 1
signed = true
min = -1000
max = 1000
default = 0
applies = "now"
brief = "A fixed torque that the drive adds to the torque command in position mode. Use it to hold a vertical axis against gravity."

[[param]]
code = "P02-51"
name = "Forward friction compensation"
unit = "%"
decimals = 1
signed = true
min = -1000
max = 1000
default = 0
applies = "now"
brief = "A torque that the drive adds in the forward direction to overcome static friction. It applies in position mode."

[[param]]
code = "P02-52"
name = "Reverse friction compensation"
unit = "%"
decimals = 1
signed = true
min = -1000
max = 1000
default = 0
applies = "now"
brief = "A torque that the drive adds in the reverse direction to overcome static friction. It applies in position mode."

[[param]]
code = "P02-59"
name = "Gain format"
min = 0
max = 1
default = 0
applies = "now"
brief = "Selects the current loop gain format. Use 0 for parameter sets from firmware V4.x to V6.x."
choices = [
  { value = 0, label = "Old format (firmware V4.x to V6.x)" },
  { value = 1, label = "New current loop format" },
]

[[param]]
code = "P02-60"
name = "Current loop integral limit"
min = 0
max = 16383
default = 0
applies = "unspecified"
access = "factory"
brief = "Factory setting. Do not change it."

[[param]]
code = "P02-61"
name = "D-axis current loop P gain"
min = 0
max = 8888
default = 0
applies = "unspecified"
access = "factory"
brief = "Factory setting. Do not change it."

[[param]]
code = "P02-62"
name = "D-axis current loop I gain"
min = 0
max = 8888
default = 0
applies = "unspecified"
access = "factory"
brief = "Factory setting. Do not change it."

[[param]]
code = "P02-63"
name = "Q-axis current loop P gain"
min = 0
max = 8888
default = 0
applies = "unspecified"
access = "factory"
brief = "Factory setting. Do not change it."

[[param]]
code = "P02-64"
name = "Q-axis current loop I gain"
min = 0
max = 8888
default = 0
applies = "unspecified"
access = "factory"
brief = "Factory setting. Do not change it."

[[param]]
code = "P03-00"
name = "Position command source"
min = 0
max = 1
default = 0
applies = "now"
change = "servo-off"
brief = "Selects where the position command comes from."
choices = [
  { value = 0, label = "Pulse input" },
  { value = 1, label = "Digital (communication)" },
]

[[param]]
code = "P03-01"
name = "Pulse input format"
min = 0
max = 3
default = 1
applies = "now"
change = "servo-off"
brief = "The signal format of the pulse command input. It must match the controller output."
choices = [
  { value = 0, label = "A/B quadrature" },
  { value = 1, label = "Pulse and direction" },
  { value = 2, label = "CW/CCW pulses" },
  { value = 3, label = "CW/CCW pulses (same as 2)" },
]

[[param]]
code = "P03-02"
name = "Pulse input port"
min = 0
max = 1
default = 0
applies = "now"
change = "servo-off"
brief = "Selects the pulse command input on connector CN1."
choices = [
  { value = 0, label = "Low-speed input" },
  { value = 1, label = "High-speed input" },
]

[[param]]
code = "P03-03"
name = "Pulse direction invert"
min = 0
max = 1
default = 0
applies = "now"
change = "servo-off"
brief = "Reverses the count direction of the pulse command."
choices = [
  { value = 0, label = "Normal" },
  { value = 1, label = "Reversed" },
]

[[param]]
code = "P03-04"
name = "Pulse input filter"
min = 0
max = 3
default = 0
applies = "now"
