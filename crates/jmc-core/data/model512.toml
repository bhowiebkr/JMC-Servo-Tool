[[param]]
code = "P03-60"
name = "Homing enable"
min = 0
max = 6
default = 0
applies = "now"
brief = "Controls the homing function. The meaning of the values 0 to 6 is not documented."

[[param]]
code = "P03-61"
name = "Homing method"
min = 0
max = 9
default = 0
applies = "now"
brief = "Selects the homing method. The meaning of the values 0 to 9 is not documented."

[[param]]
code = "P03-65"
name = "Homing high speed"
min = 0
max = 3000
default = 100
applies = "now"
change = "servo-off"
brief = "The speed for the search for the home switch. The unit is not documented. It is probably rpm."

[[param]]
code = "P03-66"
name = "Homing low speed"
min = 0
max = 1000
default = 10
applies = "now"
change = "servo-off"
brief = "The speed for the final approach to home. The unit is not documented. It is probably rpm."

[[param]]
code = "P03-67"
name = "Homing ramp time"
min = 0
max = 5000
default = 0
applies = "now"
change = "servo-off"
brief = "The acceleration and deceleration time during homing. The unit is not documented. It is probably ms."

[[param]]
code = "P03-68"
name = "Homing time limit"
min = 0
max = 10000
default = 0
applies = "now"
change = "servo-off"
