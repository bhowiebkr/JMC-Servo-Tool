[[param]]
code = "P08-11"
name = "Adaptive notch mode"
min = 0
max = 4
default = 0
applies = "now"
brief = "Selects the adaptive notch function. The adaptive notch finds a resonance and sets notch filter 3, or notch filters 3 and 4, to suppress it."
choices = [
  { value = 0, label = "Off (keep notch 3 and 4 values)" },
  { value = 1, label = "One adaptive notch (notch 3)" },
  { value = 2, label = "Two adaptive notches (notch 3 and 4)" },
  { value = 3, label = "Detect resonance only" },
  { value = 4, label = "Reset notch 3 and 4 to factory values" },
]

[[param]]
code = "P08-13"
name = "Adaptive notch sensitivity"
min = 1
max = 7
default = 4
applies = "now"
brief = "The vibration level at which the adaptive notch operates. A lower value detects smaller vibration."

[[param]]
code = "P08-19"
name = "Speed feedback filter"
unit = "ms"
decimals = 2
min = 0
max = 2500
default = 80
applies = "now"
brief = "A low-pass filter on the speed feedback. Increase it if the motor makes a high-pitched noise. Too high a value adds delay."

[[param]]
code = "P08-20"
name = "Torque command filter"
unit = "ms"
decimals = 2
min = 0
max = 2500
default = 80
applies = "now"
brief = "The time constant of the torque command filter. Increase it if the motor makes a high-pitched noise. Too high a value adds delay. Auto-tuning (P01-02) sets this value."

[[param]]
code = "P08-21"
name = "Torque command filter, low speed"
unit = "ms"
decimals = 2
min = 0
max = 2500
default = 80
applies = "now"
brief = "The time constant of the torque command filter at low speed. The speed at which the drive uses it is not documented. Increase it if the motor makes a high-pitched noise at low speed."

[[param]]
code = "P08-25"
name = "Disturbance compensation gain"
unit = "%"
decimals = 1
min = 0
max = 1000
default = 0
applies = "now"
brief = "The gain of the disturbance torque observer. A higher value resists load disturbance better, but can increase noise."

[[param]]
code = "P08-26"
